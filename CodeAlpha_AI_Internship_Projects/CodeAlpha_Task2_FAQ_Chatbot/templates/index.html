<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FAQ Chatbot</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="chat">
  <h1>💬 FAQ Chatbot</h1>
  <p>Ask a question and the NLP engine will find the closest FAQ.</p>
  <div id="messages" class="messages">
    <div class="bot"><b>Bot:</b> Hello! Ask me about the internship or this project.</div>
  </div>
  <div class="input-row">
    <input id="question" placeholder="Type your question..." autocomplete="off">
    <button id="ask">Ask</button>
  </div>
</main>
<script>
const input=document.getElementById("question"), box=document.getElementById("messages");
function add(cls,text){const d=document.createElement("div");d.className=cls;d.innerHTML=text;box.appendChild(d);box.scrollTop=box.scrollHeight;}
async function ask(){
 const q=input.value.trim(); if(!q)return;
 add("user","<b>You:</b> "+q); input.value="";
 try{
   const r=await fetch("/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
   const d=await r.json(); if(!r.ok) throw new Error(d.error);
   add("bot","<b>Bot:</b> "+d.answer+"<small>Match confidence: "+d.confidence+"</small>");
 }catch(e){add("bot","<b>Bot:</b> "+e.message);}
}
document.getElementById("ask").onclick=ask;
input.addEventListener("keydown",e=>{if(e.key==="Enter")ask();});
</script>
</body>
</html>
